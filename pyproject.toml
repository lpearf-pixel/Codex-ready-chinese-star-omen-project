[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ancient-chinese-astro-model"
version = "0.1.0"
description = "Traceable Chinese traditional astro-omen research engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "jsonschema>=4.22",
  "typer>=0.12",
  "skyfield>=1.49",
  "pytest>=8.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
